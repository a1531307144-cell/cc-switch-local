appId: com.ccswitchlocal.app
productName: CC Switch Local
directories:
  output: release
files:
  - out/**
  - package.json
  - "!**/*.map"
win:
  icon: build/icon.png
  target:
    - target: nsis
      arch:
        - x64
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  shortcutName: CC Switch Local
  # 用户要求：卸载时清空全部数据（含 API Key）。升级安装不受影响。
  deleteAppDataOnUninstall: true
publish:
  provider: github
  releaseType: release

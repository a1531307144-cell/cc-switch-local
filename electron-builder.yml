appId: com.ccswitchlocal.app
productName: CC Switch Local
directories:
  output: release
files:
  - out/**
  - package.json
  - "!**/*.map"
win:
  target:
    - target: nsis
      arch:
        - x64
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  shortcutName: CC Switch Local
